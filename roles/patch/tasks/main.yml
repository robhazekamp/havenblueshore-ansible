---
# OS patching. Never reboots the machine — a pending reboot is left for the
# user. Failures here do not fail the playbook (the agents are already
# handled); the failure is visible in the ansible-pull log.
- name: Update the apt cache and upgrade (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    cache_valid_time: 3600
    dpkg_options: force-confdef,force-confold
  when: ansible_facts.pkg_mgr == "apt"
  register: hb_apt
  failed_when: false

- name: Upgrade all packages (RHEL)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: ansible_facts.pkg_mgr == "dnf"
  register: hb_dnf
  failed_when: false

- name: Install macOS software updates
  ansible.builtin.command: softwareupdate --install --all
  when: ansible_facts.os_family == "Darwin"
  register: hb_su
  failed_when: false
  changed_when: "'No new software available' not in hb_su.stdout"

- name: Find the console user (macOS, for Homebrew)
  ansible.builtin.command: stat -f%Su /dev/console
  when: ansible_facts.os_family == "Darwin"
  register: hb_console_user
  failed_when: false
  changed_when: false

- name: Upgrade Homebrew packages as the console user (macOS)
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  become: true
  become_user: "{{ hb_console_user.stdout | trim }}"
  when:
    - ansible_facts.os_family == "Darwin"
    - hb_console_user.rc == 0
    - hb_console_user.stdout | trim != ""
    - hb_console_user.stdout | trim != "root"
  register: hb_brew
  failed_when: false
